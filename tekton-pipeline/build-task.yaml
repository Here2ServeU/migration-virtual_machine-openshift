# build-task.yaml (tekton-pipeline/build-task.yaml)
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-flask-app
spec:
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
      default: main
    - name: image
      type: string
      description: Full image reference to push, e.g. quay.io/your-repo/flask-app:latest
    - name: context-dir
      type: string
      default: containerized-apps/flask-app
  workspaces:
    - name: source
    - name: dockerconfig
      description: Optional .dockerconfigjson with push credentials for the registry
      optional: true
  steps:
    - name: clone
      image: docker.io/alpine/git:2.47.2
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        rm -rf ./repo
        git clone --depth 1 --branch "$(params.revision)" "$(params.repo-url)" ./repo
    - name: build-and-push
      image: gcr.io/kaniko-project/executor:v1.23.2
      env:
        - name: DOCKER_CONFIG
          value: $(workspaces.dockerconfig.path)
      args:
        - "--dockerfile=$(workspaces.source.path)/repo/$(params.context-dir)/Dockerfile"
        - "--context=$(workspaces.source.path)/repo/$(params.context-dir)"
        - "--destination=$(params.image)"
